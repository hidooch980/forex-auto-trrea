name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas fastapi pydantic httpx2
      - name: Compile Python modules
        run: python -m compileall -q apps modules
      - name: Risk and behavioral guard tests
        run: python -m pytest -q modules/risk_behavior_guard/tests
      - name: Cross-market portfolio risk tests
        run: python -m pytest -q modules/portfolio_risk_guard/tests
      - name: Persistent risk ledger tests
        run: python -m pytest -q modules/risk_state_store/tests
      - name: Persistent data pipeline tests
        run: python -m pytest -q modules/data_pipeline/tests
      - name: Agent performance memory tests
        run: python -m pytest -q modules/performance_memory/tests
      - name: Cognitive cell learning tests
        run: python -m pytest -q modules/cognitive_cells/tests
      - name: Unified ERP API integration tests
        run: python -m pytest -q modules/erp_api/tests
      - name: XAUUSD Phantom four-engine tests
        run: PYTHONPATH=modules python -m pytest -q modules/xauusd_phantom/tests
      - name: Smart exit tests
        working-directory: modules/smart_exit
        run: PYTHONPATH=. python -m pytest -q
      - name: Market data quality tests
        run: python -m pytest -q modules/market_data_quality/tests
      - name: Agent contract tests
        run: python -m pytest -q modules/agent_contracts/tests
      - name: Ensemble guard tests
        working-directory: modules/ensemble_ai
        run: PYTHONPATH=. python -m pytest -q
      - name: Hybrid master brain tests
        run: python -m unittest discover -s modules/master_brain/tests -v
      - name: Analytics tests
        working-directory: modules/analytics
        run: PYTHONPATH=. python -m pytest -q
      - name: FTMO compliance tests
        working-directory: modules/ftmo_compliance
        run: PYTHONPATH=. python -m pytest -q
      - name: News AI tests
        working-directory: modules/news_ai
        run: PYTHONPATH=. python -m pytest -q
      - name: Broker directory tests
        run: python -m pytest -q modules/broker_directory/tests
      - name: Market radar tests
        run: PYTHONPATH=. python -m pytest -q modules/market_radar/tests
      - name: Backtest lab tests
        run: PYTHONPATH=. python -m pytest -q modules/backtest_lab/tests
      - name: Adaptive SLTP tests
        run: PYTHONPATH=. python -m pytest -q modules/sltp_engine/tests modules/mt5_discovery/tests
      - name: Control center tests
        working-directory: apps/control_center
        run: PYTHONPATH=. python -m pytest -q tests
      - name: MT5 web bridge tests
        run: PYTHONPATH=. python -m pytest -q modules/mt5_web_bridge/tests
